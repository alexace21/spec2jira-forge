name: Deploy to production

# Phase-2 #4 — the ONE token-bearing workflow (docs/MONITORING-CICD-STRATEGY.md §14; setup: docs/PROD-DEPLOY-SETUP.md).
# HIGHEST BLAST RADIUS: FORGE_API_TOKEN is the vendor's full Atlassian credential. `forge deploy -e production`
# PUBLISHES the new Marketplace version — for a MINOR / no-scope release it goes PUBLIC and auto-rolls to ALL
# paying customers (progressive, <=120h); a scope-touching MAJOR is gated on per-admin re-consent instead.
# There is NO "staged, manual-publish-later" step for a routine deploy — THE DEPLOY IS THE RELEASE (live-confirmed
# 2026-06-23: a deploy created Marketplace v6.2.0 which went live to customers). So the approval gate + token
# isolation below are the real safety. The safety model:
#  - workflow_dispatch ONLY (a human clicks Run) — NEVER on push/pull_request, so a fork/PR can never reach
#    the token. (The zero-secret merge gates live in ci.yml; this file is the only place the token appears.)
#  - the job declares `environment: production` → GitHub blocks it on the required-reviewers gate AND scopes
#    the FORGE_* secrets to THIS job only (they are Environment secrets, never repo secrets).
#  - inputs are passed to shell via env (never interpolated into run: directly) — no script injection.
#  - the FORGE_* values come from `secrets.*`, which GitHub auto-redacts from ALL logs (no ::add-mask:: needed).
#  - ⚠ SHA-PIN the two actions below — an assertion step FAILS the deploy (fail-fast, BEFORE any token use)
#    while they are still @v-tags (go-live step — PROD-DEPLOY-SETUP.md §5). This is POLICY enforcement; the
#    token itself is protected by Environment-secret scoping (not injected into the checkout/setup-node steps)
#    regardless. Dependabot (github-actions) surfaces the pins.
#  - NO Forge rollback: recovery is fix-forward (MINOR auto-rolls <=120h; a scope change = per-admin
#    re-consent, days). A scope-touching release MUST be rehearsed on the staging Forge env first.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version you intend to ship — MUST equal package.json + DIAG_APP_VERSION (e.g. 6.2.0)"
        required: true
        type: string
      scope_ack:
        description: "Does this release change manifest scopes / egress?"
        required: true
        type: choice
        default: "no scope change"
        options:
          - "no scope change"
          - "yes — rehearsed on the staging Forge env"

permissions:
  contents: read # least-privilege: this job only reads the repo; it needs no write scopes

concurrency:
  group: deploy-production
  cancel-in-progress: false # NEVER interrupt an in-flight publish

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production # ← required-reviewers approval gate + scopes the FORGE_* secrets to THIS job only
    timeout-minutes: 20
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.3.1 — SHA-pinned (token-bearing job; bump via Dependabot)
        with:
          fetch-depth: 0

      - name: Use Node 24 (match the Forge nodejs24.x runtime)
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4.4.0 — SHA-pinned (bump via Dependabot)
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            static/hello-world/package-lock.json

      - name: Assert Node 24
        run: node -e "if(!process.version.startsWith('v24')){console.error('Node '+process.version+' != v24');process.exit(1)}"

      - name: Assert deploy actions are SHA-pinned (fail-fast policy enforcement — §14.3 #2; runs before any token use)
        run: |
          # ^[[:space:]]*uses: anchors to a real step line — so a `# uses: ...@v` COMMENT or this grep's own
          # command line cannot false-trigger; only the actual `uses: actions/checkout@v` / `setup-node@v` match.
          if grep -nE '^[[:space:]]*uses:[[:space:]]*actions/(checkout|setup-node)@v' .github/workflows/deploy.yml; then
            echo "::error::deploy.yml still references @v-tag actions (shown above). SHA-pin actions/checkout + actions/setup-node to full commit SHAs before deploying with the prod token (PROD-DEPLOY-SETUP.md §5)."
            exit 1
          fi
          echo "Deploy actions are SHA-pinned — OK."

      - name: Conscious-version-bump guard (typed version must equal package.json — catches a forgotten bump)
        env:
          TYPED_VERSION: ${{ inputs.version }} # via env (not direct interpolation) → no shell injection
        run: |
          PKG=$(node -p "require('./package.json').version")
          if [ "$TYPED_VERSION" != "$PKG" ]; then
            echo "::error::Typed version '$TYPED_VERSION' != package.json '$PKG'. Bump package.json + src/diagnostics.js DIAG_APP_VERSION together (npm run check enforces the pair) or type the correct version."
            exit 1
          fi
          echo "Deploying version $PKG."

      - name: Install root deps
        run: npm ci

      - name: Full gate (check + offline tests + CRA build) — identical to the merge gate
        run: npm run ci # check (version-drift + per-file ESM) → test → build:ui (builds the Custom UI forge bundles)

      - name: Install + configure Forge CLI (pinned major — ⚠ match your local `forge --version`; strategy §3.2b)
        run: |
          # Bumped @12 → @13 (2026-06-26): @forge/cli@12 (12.22.0) CONSISTENTLY failed the deploy
          # fetching a STALE forge-node-runtime wrapper asset — "Premature close" on 3/3 retries of
          # the SAME timestamped URL (i.e. NOT transient; the retry couldn't help because the old CLI
          # re-resolves the same problematic wrapper). The CLI's own warning recommended 12.22.0 → 13.0.0;
          # @13 resolves the CURRENT runtime wrapper. ⚠ Update your LOCAL `forge` to @13 too for parity
          # (`npm i -g @forge/cli@13`) — the §3.2b "match local" intent. The deploy-step retry stays as a
          # defense for genuinely-transient network blips.
          npm install -g @forge/cli@13
          # A FRESH CLI in CI has no usage-analytics preference, and `--non-interactive` (used at deploy) REFUSES
          # to run until one is set. false = opt out of CLI telemetry (consistent with the no-egress posture;
          # this is the CLI's own telemetry, NOT app/customer data). Caught live by the §6 test (strategy §14.6).
          forge settings set usage-analytics false

      - name: forge lint (ADVISORY — visibility only; the globalPage resolver flag is a known false-positive, gotcha #13)
        continue-on-error: true
        env:
          FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
          FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
        run: forge lint

      # Deploy-time scope gate = this CONSCIOUS manual ack, NOT a re-run of tools/scope-diff-guard.mjs: on a
      # workflow_dispatch there is no meaningful base SHA to diff against, and the auto guard already ran at PR
      # time in ci.yml. Forcing the human to type "rehearsed on staging" IS the §3.3 goal (make re-consent
      # visible, never auto-decide it). See strategy §14.2.
      - name: Scope / re-consent acknowledgment
        env:
          SCOPE_ACK: ${{ inputs.scope_ack }}
        run: |
          echo "Scope acknowledgment: $SCOPE_ACK"
          if [ "$SCOPE_ACK" != "no scope change" ]; then
            echo "::warning::Scope/egress change → every customer admin RE-CONSENTS in Manage Apps; recovery is per-admin (days), not the <=120h MINOR auto-roll. Confirm the staging rehearsal + Marketplace release notes."
          fi

      - name: forge deploy -e production (auto-creates the Marketplace version)
        env:
          FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
          FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
        # TWO defenses against Atlassian-side TRANSIENT network flakiness during deploy — both
        # surface as "Invalid response body … Premature close" fetching an Atlassian endpoint
        # (NOT our code; recurring on the GitHub-runner ↔ Atlassian-CDN link):
        #  1. --no-verify — `forge deploy` otherwise runs `forge lint` INTERNALLY, which fetches
        #     the external Jira swagger (developer.atlassian.com/.../swagger.v3.json), flaky.
        #     --no-verify skips that internal lint (lint still runs as the ADVISORY step above;
        #     it also sidesteps the globalPage-resolver lint false-positive, gotcha #13).
        #  2. RETRY — the deploy ALSO fetches CDN assets during PACKAGING (e.g. the forge-node-
        #     runtime wrapper.js) which "Premature close" too. We retry ONLY that transient
        #     network class. ⭐ SAFE re: duplicate versions: these fetches fail during packaging,
        #     BEFORE any Marketplace version is created, so a retry cannot create a duplicate. A
        #     NON-transient failure (real manifest/auth/version error, or a post-upload failure)
        #     is NOT retried — fail fast. The bundle is still validated by `npm run ci` + server-side.
        run: |
          max=3
          attempt=1
          while true; do
            echo "::group::forge deploy — attempt ${attempt}/${max}"
            set +e
            forge deploy -e production --non-interactive --no-verify 2>&1 | tee /tmp/forge_deploy.log
            rc=${PIPESTATUS[0]}
            set -e
            echo "::endgroup::"
            if [ "$rc" -eq 0 ]; then
              echo "forge deploy succeeded on attempt ${attempt}."
              if [ "$attempt" -gt 1 ]; then
                echo "::warning::Deploy succeeded after ${attempt} attempts (transient-network retries). The retried (failed) attempts hit PRE-version packaging fetches and should not have created a version — but confirm the portal Versions tab shows exactly ONE new version."
              fi
              break
            fi
            if ! grep -qiE 'Premature close|socket hang up|ECONNRESET|ETIMEDOUT|EAI_AGAIN' /tmp/forge_deploy.log; then
              echo "::error::forge deploy failed with a NON-transient error (no known network signature) — NOT retrying. It is a real failure (manifest/auth/version), or a post-upload error where a retry could create a DUPLICATE version. Inspect the log above."
              exit "$rc"
            fi
            if [ "$attempt" -ge "$max" ]; then
              echo "::error::forge deploy still hit a transient 'Premature close' fetch after ${max} attempts (Atlassian-CDN flakiness). Nothing was published (these fetches fail during packaging, before version creation). Re-run: Actions → Deploy to production → Run workflow."
              exit "$rc"
            fi
            wait_s=$(( attempt * 20 ))
            echo "Transient network error on attempt ${attempt} — retrying in ${wait_s}s…"
            sleep "${wait_s}"
            attempt=$(( attempt + 1 ))
          done

      - name: Post-deploy reminders (job summary) — on SUCCESS only
        if: success()
        env:
          VERSION: ${{ inputs.version }}
          SCOPE_ACK: ${{ inputs.scope_ack }}
        run: |
          {
            echo "### ✅ Production deploy — v${VERSION}"
            echo ""
            echo "- Scope: **${SCOPE_ACK}**"
            echo "- ⚠ **This version is now PUBLISHED.** For a MINOR / no-scope release it is LIVE and auto-rolls to ALL customers (progressive, ≤120h). (A scope-touching MAJOR instead waits on per-admin re-consent in Manage Apps.) The deploy IS the release — there is no separate manual publish."
            echo "- forge lint ran advisory — if its step shows a ⚠, check it (the globalPage resolver flag is a known false-positive, gotcha #13)."
            echo "- ⚠ **No rollback** — recovery is fix-forward (deploy a corrected higher version). The MINOR auto-roll IS the de-facto canary; a scope-touching fix needs per-admin re-consent (days)."
            echo "- **Next:** watch the dev-console Invocation metrics (production) error rate. (The Marketplace version number is forge-assigned and runs AHEAD of the repo version — bump package.json + DIAG_APP_VERSION past it before the next deploy.)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy FAILED — recovery note (job summary) — on FAILURE only
        if: failure()
        env:
          VERSION: ${{ inputs.version }}
        run: |
          {
            echo "### ❌ Production deploy FAILED — v${VERSION}"
            echo ""
            echo "- Nothing was published if forge deploy did not run; check the failing step above."
            echo "- Fix locally, run \`npm run ci\` green, then re-trigger: Actions → Deploy to production → Run workflow."
          } >> "$GITHUB_STEP_SUMMARY"
