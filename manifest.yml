modules:
  # Migrated 2026-05-08 from confluence:contentAction (xlarge side-panel)
  # → confluence:globalPage (full-page). Editor flow unified с future
  # CG-12 dashboard в single app surface. Page binding: NEW page picker
  # (no auto-binding via ctx.extension.content.id). Reinstall required
  # на upgrade — module type change.
  #
  # Schema note (empirically verified runtime 2026-05-08): globalPage
  # с Custom UI (resource form) REQUIRES `resolver:` binding для invoke()
  # calls to route correctly. Forge linter incorrectly reports `resolver:`
  # as invalid for globalPage (false positive — likely outdated lint plugin
  # schema); Atlassian official docs explicitly include resolver block в
  # globalPage Custom UI examples. Workaround: deploy с `forge deploy
  # --no-verify` to bypass the false-positive lint check.
  #
  # Initial draft removed resolver per lint feedback → runtime crashed
  # с "Entry point 'resolver' for extension 'spec2jira-app' could not
  # be invoked" (binding gap). Re-added resolver binding 2026-05-08.
  confluence:globalPage:
    - key: spec2jira-app
      title: Spec2Tickets
      route: home
      resource: main
      resolver:
        function: resolver
      # No unlicensedAccess: this is a Paid-via-Atlassian app, so by DEFAULT
      # Atlassian admits only licensed users — and that is exactly what we want.
      # The in-app perpetual Free tier was REMOVED 2026-06-03 (the 30-day Atlassian
      # trial that Paid-via-Atlassian apps get for free already covers evaluation),
      # so the unlicensedAccess hook it relied on (which only ever admitted
      # Confluence GUESTS, never a clean "post-trial free user" — and rode on a
      # spoofable guest-guard) is gone. Model is now trial → paid (BYOK/Managed Pro).
  # U3 part 33 (2026-05-09) — confluence:contentAction inline-on-page
  # entry surface. Closes "Apps menu navigation friction" partner UX
  # insight 2026-05-08 part 18 — user clicks "Generate Breakdown с
  # Spec2Tickets" button on Confluence page byline → globalPage opens
  # с that page already bound via KVS deep-link relay (no picker step).
  #
  # PARALLEL surface to globalPage (NOT replacement). Part 17 migration
  # (2026-05-08) moved AWAY от contentAction-as-app-surface architecture
  # because contentAction xlarge sidebar (~720-800px) constrained screen
  # layouts. contentAction here renders the SAME `main` resource
  # (App.js); App.js detects ctx.moduleKey === "spec2jira-launch" and
  # uses Forge router.navigate({ target: "module",
  # moduleKey: "spec2jira-app" }) to re-route to globalPage immediately.
  # KVS relay (PENDING_DEEP_LINK_KEY) carries pageId/title across the
  # navigation hop.
  #
  # Reinstall required on upgrade (new module type registration).
  confluence:contentAction:
    - key: spec2jira-launch
      title: Generate Breakdown with Spec2Tickets
      resource: main
      resolver:
        function: resolver
      # No unlicensedAccess — see the globalPage note. Licensed-only by default
      # (Paid-via-Atlassian); the in-app Free tier was removed 2026-06-03.
  confluence:globalSettings:
    - key: spec2jira-settings
      resource: main
      resolver:
        function: resolver
      title: Spec2Tickets Settings
      useAsConfig: true
      # NOTE: confluence:globalSettings does NOT support unlicensedAccess (a hard
      # forge-lint error — verified 2026-06-03). Moot now: the app is licensed-only
      # (the in-app Free tier was removed 2026-06-03), so no surface declares
      # unlicensedAccess.
  # ── Task #13: never-pushed-orphan cleanup (2026-06-14) ───────────────────────
  # Daily sweep that deletes a generated-but-never-pushed breakdown 7 days after its
  # last access — the privacy / data-minimization backstop for abandoned generations
  # (purgeJob already removes a breakdown on push; this covers the never-pushed case).
  # ACCESS-renewed (jobmeta.lastAccessedAt, bumped on every meaningful access — review/reconnect + TC/push),
  # NOT a creation-anchored native TTL — a KVS TTL renews only on `set`, so a read-only
  # review would silently lose the deliverable (§11). System trigger (no user context)
  # → KVS only (asApp, storage:app). Per-installation. interval: day | hour | week.
  scheduledTrigger:
    - key: orphan-sweep
      function: orphan-sweep-fn
      interval: day
  function:
    # Single resolver handles ALL backend work in v3.0.1+:
    #   - Settings (BYOK API key), Confluence page fetch/search
    #   - Generation: Anthropic Message Batches API (submit + poll). Async
    #     event consumers were retired 2026-05-29 (55-sec timeout → runaway
    #     retries) в favour of Anthropic-side batch processing.
    #   - JIRA push: CHUNKED asUser() resolver. startPush does project lookup
    #     + Epic create + a KVS session; the UI then loops pushStep, each doing
    #     ONE bounded JIRA batch (≤15 issues) to stay under the 25-sec resolver
    #     timeout. Async event consumers were retired 2026-05-30 — asUser() е
    #     unavailable in async context (AUTH_TYPE_UNAVAILABLE); resolver-only.
    - key: resolver
      handler: index.handler
    # Task #13 orphan sweep (scheduledTrigger above). System invocation, KVS-only.
    - key: orphan-sweep-fn
      handler: index.sweepHandler
resources:
  - key: main
    path: static/hello-world/build
permissions:
  external:
    fetch:
      # v3.0.0 pivot 2026-05-28: replaced customer-hosted backend
      # (https://api.spec2jira.com — Qwen 14B GGUF on NVIDIA GPU) с
      # direct Anthropic API call (Claude Sonnet 4.6 + structured
      # outputs). BYOK pattern — customer provides own API key via
      # Settings UI, stored in Forge KVS secret storage.
      #
      # Property name 'backend' е the Forge manifest schema's predefined
      # key for external fetch egress (не arbitrary). Despite the name,
      # this declares egress access TO https://api.anthropic.com — there
      # е no Spec2JIRA-operated backend.
      backend:
        - address: https://api.anthropic.com
  scopes:
    - storage:app
    # Confluence read scopes (granular only — least privilege).
    # search:confluence: the /wiki/rest/api/search CQL endpoint used by PagePicker.
    - search:confluence
    # read:page:confluence: the /wiki/api/v2/pages/{id} endpoint used by
    # fetchPage + startGeneration. v1 /wiki/rest/api/content/{id} returns
    # 410 Gone, so the v2 page read is mandatory.
    #
    # Removed 2026-05-31 (pre-listing least-privilege pass): the classic
    # scopes read:confluence-content.summary + read:confluence-content.all
    # were legacy fallbacks for the retired v1 /content/* endpoints. A repo
    # grep confirmed only search + v2 pages are called now; the granular
    # scopes above cover both. If PagePicker search ever 403s after this,
    # re-add read:confluence-content.summary (its classic equivalent).
    - read:page:confluence
    # v3.0.0 NEW — JIRA write scopes for asUser() push.
    # Replaces v2.x service-account pattern (was: backend uses customer-
    # provisioned email + API token к POST к JIRA). Forge native
    # asUser() means the invoking user's permissions apply automatically
    # — no service account needed; closes Atlassian's earlier security
    # review concern about service-account model.
    #
    # write:jira-work — create Story + Subtask issues
    # read:jira-work — read project metadata (issue types, fields) before create
    - write:jira-work
    - read:jira-work
app:
  runtime:
    name: nodejs24.x
    memoryMB: 512
    architecture: arm64
  id: ari:cloud:ecosystem::app/e804f31f-1cbf-4f09-86c1-11e36f387fe7
  # ── XCA compatibility (Confluence required / Jira optional) ──────────
  # ✅ RESOLVED 2026-06-04. The Paid-via-Atlassian "more than one parent software"
  # publish error was a vendor-portal LISTING-config issue, NOT the manifest. Fix:
  # portal → app → [version] details → Compatibility tab → remove Jira (leave Confluence
  # the SOLE billing parent). This jira.required:false form is correct. NOTE: the Jira
  # push DOES need the Jira install (asUser().requestJira; a Confluence-only install
  # 403s — gotcha #10 HOLDS; Jira = an optional CONNECTION installed via
  # `forge install -p jira`). v5.3.0 resubmitted 2026-06-04 (awaiting review).
  compatibility:
    confluence:
      required: true
    jira:
      required: false
  # ── Paid-via-Atlassian + TWO editions (Standard/Advanced) ────────────
  # The platform cap is EXACTLY two editions. editionsEnabled is MANDATORY for
  # the two-price hybrid (licensing.enabled alone → a SINGLE price):
  #   Standard = BYOK Pro    (customer's own key, UNLIMITED) — portal price (set 2026-06-04):
  #                            100% of Confluence ($6.70/user, $57 ≤10, declining, 1.5x multi)
  #   Advanced = Managed Pro (our key; capped 10/USER/mo) — editions are a POST-PUBLISH phase,
  #                            so Advanced is ADDED AFTER the app is live (Phase 2; price $13/user planned)
  # Runtime tells them apart via context.license.capabilitySet
  # (capabilitystandard / capabilityadvanced) — see src/usage.js resolveTier.
  # Prices/edition names are set in the vendor portal, NOT here. Evaluation is the
  # 30-day Atlassian trial (auto-provided for Paid-via-Atlassian apps; reads as an
  # active license at runtime) — the in-app perpetual Free 3/mo tier was REMOVED
  # 2026-06-03, so there is no €0 edition and no unlicensedAccess surface.
  licensing:
    enabled: true
    editionsEnabled: true